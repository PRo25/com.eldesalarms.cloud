<style>
  .eldes-login {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }

  .eldes-login label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-weight: 600;
  }

  .eldes-login input {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    border: 1px solid #aeb8c2;
    border-radius: 6px;
    font: inherit;
  }

  .eldes-login button {
    margin-top: 8px;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    color: #fff;
    background: #18619b;
    font: inherit;
    font-weight: 600;
  }

  .eldes-login button:disabled {
    opacity: 0.6;
  }

  .eldes-login p {
    margin: 0;
    font-size: 0.9em;
  }
</style>

<form class="eldes-login" id="eldes-login-form">
  <label>
    ELDES account email
    <input id="eldes-email" type="email" autocomplete="username" required>
  </label>
  <label>
    ELDES account password
    <input id="eldes-password" type="password" autocomplete="current-password" required>
  </label>
  <label>
    ELDES alarm PIN
    <input id="eldes-pin" type="password" autocomplete="off" required>
  </label>
  <label>
    Encryption passphrase
    <input id="encryption-passphrase" type="password" autocomplete="new-password" minlength="12" required>
  </label>
  <p>The alarm PIN and refresh token are encrypted with your passphrase. Use at least 12 characters. The passphrase is never saved; after a Homey app restart, repair this device and enter it again.</p>
  <p id="repair-view-error" role="alert" hidden></p>
  <button id="eldes-login-button" type="submit">Log in and repair alarm system</button>
</form>

<script>
  const form = document.getElementById('eldes-login-form');
  const button = document.getElementById('eldes-login-button');
  const viewError = document.getElementById('repair-view-error');
  button.disabled = true;

  const waitForHomey = () => new Promise((resolve, reject) => {
    const startedAt = Date.now();
    let timer;
    const checkForHomey = () => {
      if (window.Homey) {
        window.clearInterval(timer);
        resolve(window.Homey);
      } else if (Date.now() - startedAt >= 10000) {
        window.clearInterval(timer);
        reject(new Error('Homey did not initialize the repair view.'));
      }
    };

    timer = window.setInterval(checkForHomey, 100);
    checkForHomey();
  });
  const homeyPromise = waitForHomey();

  const initializeView = async () => {
    try {
      const homey = await homeyPromise;
      homey.ready();
      button.disabled = false;
    } catch {
      viewError.textContent = 'Homey could not initialize the repair form. Close this screen and try again.';
      viewError.hidden = false;
    }
  };
  initializeView();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;

    const data = {
      username: document.getElementById('eldes-email').value,
      password: document.getElementById('eldes-password').value,
      pinCode: document.getElementById('eldes-pin').value,
      encryptionPassphrase: document.getElementById('encryption-passphrase').value,
    };

    try {
      const homey = await homeyPromise;
      const authenticated = await homey.emit('login', data);
      if (authenticated) {
        form.reset();
        homey.done();
      }
    } catch (error) {
      if (window.Homey) {
        window.Homey.alert(error.message || 'Could not log in to ELDES Security.');
      } else {
        viewError.textContent = 'Homey could not initialize the repair form. Close this screen and try again.';
        viewError.hidden = false;
      }
    } finally {
      data.password = '';
      data.pinCode = '';
      data.encryptionPassphrase = '';
      document.getElementById('eldes-password').value = '';
      document.getElementById('eldes-pin').value = '';
      document.getElementById('encryption-passphrase').value = '';
      button.disabled = false;
    }
  });
</script>
